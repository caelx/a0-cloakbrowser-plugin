runtime:
  enabled: true
  headed: true
  display: ":99"
  auto_start_xvfb: true
  reuse_existing_display: true
  display_width: 1440
  display_height: 960
  display_depth: 24
  viewport_width: 1440
  viewport_height: 960
  cloakbrowser_cache_dir: "/opt/cloakbrowser"
  cloakbrowser_auto_update: false

humanization:
  humanize: true
  human_preset: "default"

identity:
  fingerprint_seed_mode: "random"
  fingerprint_seed: ""
  fingerprint_platform: "Windows"
  fingerprint_noise: false
  fingerprint_screen_width: 1440
  fingerprint_screen_height: 960
  storage_quota_mb: ""

network_location:
  proxy: ""
  geoip: true
  timezone: ""
  locale: ""
  webrtc_ip_mode: "auto"
  webrtc_ip: ""

advanced:
  extra_args: []
  filter_default_playwright_args: true
  disable_shadow_dom_init_patch: true

extensions:
  enable_ublock_origin_lite: false
  enable_i_still_dont_care_about_cookies: false
  enable_bypass_paywalls_clean: false

ublock_origin_lite:
  filtering_mode: "complete"
  strict_block_mode: true
  enabled_rulesets:
    - ublock-filters
    - easylist
    - easyprivacy
    - pgl
    - adguard-spyware-url
    - block-lan
    - ublock-badware
    - urlhaus-full
    - annoyances-ai
    - annoyances-cookies
    - annoyances-notifications
    - annoyances-others
    - annoyances-overlays
    - annoyances-social
    - annoyances-widgets

bypass_paywalls_clean:
  opt_in_setcookie: true
  opt_in_custom_sites: true
  opt_in_update: true
