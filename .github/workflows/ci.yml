name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev pytest -s tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned Agent Zero image
        run: docker build -t cloakbrowser-agent-zero-ci -f ci/agent-zero.Dockerfile .
      - run: bash ci/run_agent_zero_integration.sh
        env:
          CLOAKBROWSER_AGENT_ZERO_IMAGE: cloakbrowser-agent-zero-ci
          CLOAKBROWSER_LIVE_DETECTOR: "1"
          CLOAKBROWSER_LIVE_DETECTOR_STRICT: "1"
          GITHUB_TOKEN: ${{ github.token }}
      - run: bash ci/run_agent_zero_integration.sh
        env:
          CLOAKBROWSER_AGENT_ZERO_IMAGE: cloakbrowser-agent-zero-ci
          CLOAKBROWSER_INTEGRATION_SCOPE: small-shm
          CLOAKBROWSER_DOCKER_SHM_SIZE: 64m
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloakbrowser-integration-artifacts
          path: artifacts/
