[project]
name = "a0-cloakbrowser-plugin"
version = "1.1.1"
description = "CloakBrowser-backed Agent Zero Browser overlay plugin"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "cloakbrowser[geoip]==0.3.27",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
